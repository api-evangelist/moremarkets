name: MoreMarkets
description: 'MoreMarkets is a self-custodial, cross-chain DeFi yield platform that lets holders of assets
  like XRP and DOGE earn institutional-grade yield without giving up custody of their funds. It uses Multi-Party
  Computation (MPC) key management and NEAR chain signatures to lock native assets in onchain vaults (a
  BoringVault-based architecture with tellers, managers, and principal/receipt/positional tokens) and deploy
  equivalent tokens across chains into DeFi lending and yield strategies, bridged via Wormhole and the Omni
  Bridge. In July 2025 it launched the XRP Earn Account and later partnered with Flare for additional XRP
  yield strategies. Backed by Electric Capital.'
